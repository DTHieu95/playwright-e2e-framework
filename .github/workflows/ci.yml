name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages pushes to gh-pages branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  test:
    name: Test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: lint-and-typecheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 1

  merge-reports:
    name: Merge reports + generate Allure
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blob reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Download Allure results from all shards
        uses: actions/download-artifact@v8
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # Restore prior Allure history from gh-pages so the dashboard shows trends.
      # Single shell step that detects the branch's existence first — never errors,
      # never produces a red "X" on first run when gh-pages doesn't exist yet.
      - name: Restore prior Allure history (best-effort)
        if: always()
        run: |
          mkdir -p allure-results/history
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" gh-pages > /dev/null 2>&1; then
            echo "gh-pages branch exists — fetching prior history/"
            tmpdir=$(mktemp -d)
            git clone --depth=1 --branch=gh-pages --single-branch \
              "https://github.com/${{ github.repository }}" "$tmpdir" || true
            if [ -d "$tmpdir/history" ]; then
              cp -r "$tmpdir/history/." allure-results/history/ || true
              echo "history merged"
            else
              echo "gh-pages exists but contains no history/ directory yet"
            fi
          else
            echo "gh-pages branch does not exist yet — skipping history restore (first run)"
          fi

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  publish-allure:
    name: Publish Allure report to GitHub Pages
    needs: merge-reports
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
